# Serves site/ as the Travelers website.
#
# The files in site/ are not written here — they are built from the private
# source repository and pushed in by its publish workflow. This job only takes
# what is already committed and hands it to Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Pages has to be switched on by hand once, under
      # Settings -> Pages -> Source: GitHub Actions.
      #
      # `configure-pages` offers an `enablement: true` that is supposed to spare
      # anyone that click, and it was tried here: it fails with "Create Pages
      # site failed. Resource not accessible by integration". Creating a Pages
      # site is an *administration* call, and `pages: write` does not grant it —
      # no permission this workflow can declare will. Once the setting is on,
      # this step finds the site and every later run is automatic.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
