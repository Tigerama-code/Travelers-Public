# Serves the landing page and the game as one site.
#
# Two folders, with different owners, assembled here:
#
#   landing/  ->  /        the front door. Written by hand, in this repository.
#   site/     ->  /play/   the game. Built from the private source repository
#                          and pushed in by its publish workflow.
#
# They are kept apart because that publish does `rm -rf site` before copying —
# anything of ours inside site/ would be deleted by the next release. Assembling
# at deploy time means neither folder has to know about the other.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Pages has to be switched on by hand once, under
      # Settings -> Pages -> Source: GitHub Actions.
      #
      # `configure-pages` offers an `enablement: true` that is supposed to spare
      # anyone that click, and it was tried here: it fails with "Create Pages
      # site failed. Resource not accessible by integration". Creating a Pages
      # site is an *administration* call, and `pages: write` does not grant it —
      # no permission this workflow can declare will. Once the setting is on,
      # this step finds the site and every later run is automatic.
      - uses: actions/configure-pages@v5

      # The game is built with Vite's `base: './'`, so every asset path in it is
      # relative and it runs from /play/ exactly as it did from the root.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r landing/. _site/
          if [ -d site ]; then
            mkdir -p _site/play
            cp -r site/. _site/play/
          else
            echo "::warning::No site/ yet — publishing the landing page alone. The game arrives with the next release from the source repository."
          fi
          find _site -maxdepth 2 -type f | sort | head -30

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
