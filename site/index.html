<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Travelers, a peer-to-peer game of settlement and trade. Host a room, share the code, play with friends. No accounts, no servers." />
    <!--
      The lamplit table, which is what the game opens on. A player who has
      switched to parchment gets both of these rewritten before the first
      paint, see setPalette in src/ui/tileArt.ts, so this is the default
      rather than a fixed answer.
    -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b1220" />
    <title>Travelers</title>
    <!--
      The longship, generated from src/ui/brand.ts by `npm run brand`.

      A file rather than an inline data URI: the mark now carries water and
      a shield row, and spelling that out in percent-encoding put 2.3 kB of
      unreadable string in the head of every page.

      The path is relative because the desktop shell loads this over file://,
      where a leading slash resolves to the drive root instead.
    -->
    <link rel="icon" type="image/svg+xml" href="./mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="./assets/index-CcBUxR8l.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-W9HH4QBi.css">
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <div id="modal-root"></div>
    <div id="toast-root" role="status" aria-live="assertive"></div>
  </body>
</html>
